# PostgreSQL for local development only. Production compose lives alongside
# this file and additionally runs the API, the built front-end and Caddy.
services:
  db:
    image: postgres:16-alpine
    container_name: menu-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-menu}
      POSTGRES_USER: ${POSTGRES_USER:-menu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-menu}
    ports:
      # Exposed on the host in development only; in production the database
      # stays on the internal Docker network with no published port.
      - "127.0.0.1:5432:5432"
    volumes:
      - menu-db-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-menu} -d ${POSTGRES_DB:-menu}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  menu-db-dev:
