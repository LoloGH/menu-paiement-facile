# Pre-production vhost.
#
# Same shape as menu.conf, pointing at a separate web root and a separate API
# port, so staging and production never touch each other's data or process.
#
# Two differences from production, both deliberate:
#   - a noindex header, so a search engine never lists the trial site;
#   - HTTP basic auth, so customers cannot stumble into it.
#
# Create the password file once:
#   sudo htpasswd -c /etc/apache2/.htpasswd-menu preprod

<VirtualHost *:80>
    ServerName menu-test.sukaxess.com
    DocumentRoot /var/www/menu-staging
</VirtualHost>

<VirtualHost *:443>
    ServerName menu-test.sukaxess.com
    DocumentRoot /var/www/menu-staging

    SSLEngine on
    # certbot fills these in with --apache.

    Header always set X-Robots-Tag "noindex, nofollow"

    ProxyPreserveHost On
    ProxyPass        /api/kitchen/stream http://127.0.0.1:3001/api/kitchen/stream flushpackets=on timeout=3600
    ProxyPassReverse /api/kitchen/stream http://127.0.0.1:3001/api/kitchen/stream
    ProxyPass        /api http://127.0.0.1:3001/api
    ProxyPassReverse /api http://127.0.0.1:3001/api

    RequestHeader set X-Forwarded-Proto "https"

    <Directory /var/www/menu-staging>
        # Basic auth on the whole site. The API sits behind it too, which is
        # why the smoke test needs the credentials in its URL.
        AuthType Basic
        AuthName "Préproduction"
        AuthUserFile /etc/apache2/.htpasswd-menu
        Require valid-user

        Options -Indexes
        AllowOverride None

        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/api
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    <Location /api>
        AuthType Basic
        AuthName "Préproduction"
        AuthUserFile /etc/apache2/.htpasswd-menu
        Require valid-user
    </Location>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"

    ErrorLog  ${APACHE_LOG_DIR}/menu-staging-error.log
    CustomLog ${APACHE_LOG_DIR}/menu-staging-access.log combined
</VirtualHost>
