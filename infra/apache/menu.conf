# Apache vhost for the ordering site.
#
# Apache already terminates TLS on this server for the other vhosts, so it does
# the same here: it serves the built front-end from disk and proxies /api to the
# container listening on 127.0.0.1:3000.
#
# Enable the modules this needs once:
#   a2enmod proxy proxy_http headers rewrite expires
#
# Then:
#   a2ensite menu && systemctl reload apache2
#   certbot --apache -d menu.sukaxess.com

<VirtualHost *:80>
    ServerName menu.sukaxess.com
    # certbot rewrites this block to redirect to HTTPS. Left plain so the
    # first certificate issuance can complete over HTTP.
    DocumentRoot /var/www/menu
</VirtualHost>

<VirtualHost *:443>
    ServerName menu.sukaxess.com
    DocumentRoot /var/www/menu

    SSLEngine on
    # certbot fills these in with --apache.
    # SSLCertificateFile    /etc/letsencrypt/live/menu.sukaxess.com/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/menu.sukaxess.com/privkey.pem

    # --- API ------------------------------------------------------------
    # Same origin as the front-end, so the session cookie is same-site and no
    # CORS configuration is needed anywhere.
    ProxyPreserveHost On

    # The kitchen screens hold an open server-sent events stream. Without
    # flushpackets the proxy buffers the response and events arrive in bursts —
    # or not at all — and the long timeout stops it being dropped as idle.
    # Declared before the generic /api rule: Apache matches ProxyPass in the
    # order written, so the broader one would otherwise win.
    ProxyPass        /api/kitchen/stream http://127.0.0.1:3000/api/kitchen/stream flushpackets=on timeout=3600
    ProxyPassReverse /api/kitchen/stream http://127.0.0.1:3000/api/kitchen/stream

    ProxyPass        /api http://127.0.0.1:3000/api
    ProxyPassReverse /api http://127.0.0.1:3000/api

    # Tell the API it is behind TLS so it marks cookies Secure.
    RequestHeader set X-Forwarded-Proto "https"

    # --- Front-end ------------------------------------------------------
    <Directory /var/www/menu>
        Require all granted
        Options -Indexes
        AllowOverride None

        # Single-page app: unknown paths are routes, not missing files. Real
        # files and /api are left alone.
        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/api
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    # Vite fingerprints asset filenames, so they can be cached indefinitely.
    # index.html must not be, or a deploy would not reach returning visitors.
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <LocationMatch "^/index\.html$">
        Header set Cache-Control "no-cache"
    </LocationMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog  ${APACHE_LOG_DIR}/menu-error.log
    CustomLog ${APACHE_LOG_DIR}/menu-access.log combined
</VirtualHost>
